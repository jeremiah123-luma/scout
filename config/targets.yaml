# What Scout looks for. Edit this file, not the code.
# Matching is case-insensitive. Short tokens (it, ui, ux, swe, sde, pm, ai, ml) match on word boundaries,
# so "IT" never matches "Pittsburgh" and "ai" never matches "maintenance".

# Companies. Tier 1 and Tier 2 get an instant push; everything else goes in the daily digest.
# Each entry is a list of names that count as that company. The WHOLE company name has to match one of
# them (Inc, LLC, Corp are ignored), so "Apple Inc." is Apple but "Apple Bank" is not, and
# "Meta Platforms" is Meta but "Meta Marketing Group" is not. Add subsidiaries by name.
tier1:
  google: [google, alphabet, youtube, "google deepmind", deepmind, waymo, verily, "google fiber"]
  apple: [apple]
  meta: [meta, "meta platforms", facebook, instagram, whatsapp, "reality labs"]
  amazon: [amazon, aws, "amazon web services", "amazon robotics", "amazon lab126", audible, twitch, "amazon leo", "amazon kuiper"]
  microsoft: [microsoft, github, linkedin]
  netflix: [netflix]
  nvidia: [nvidia]

tier2:
  adobe: [adobe]
  figma: [figma]
  canva: [canva]
  spotify: [spotify]
  salesforce: [salesforce, slack, tableau]
  snap: [snap, snapchat]
  pinterest: [pinterest]
  duolingo: [duolingo]
  notion: [notion]
  airbnb: [airbnb]
  uber: [uber]
  bloomberg: [bloomberg]
  ibm: [ibm]
  oracle: [oracle]
  anthropic: [anthropic]

# Company job boards read directly (scout/boards.py), for internships the public lists never carry:
# the lists are built around software engineering, so design roles like Figma's Product Design Intern
# only show up here. Board name: company name as the lists write it. Only intern, co-op, and fellow titles are kept.
# Anthropic has no internships (its careers FAQ says so); its Fellows Program is the student-reachable door.
# Palantir is Tier 3 but read for its fellowships (Meritocracy, Neurodivergent), which no list carries.
# Checked 2026-10-16; the other Tier 1 and 2 companies use Workday or their own sites, which the lists cover.
boards:
  # DoorDash (added 2026-10-26): its Product Design intern never reached the lists, which carry only its SWE roles.
  greenhouse: {figma: Figma, pinterest: Pinterest, airbnb: Airbnb, duolingo: Duolingo, anthropic: Anthropic, doordashusa: DoorDash}
  # Verified from each company's official site, 2026-10-23. Read every run, even when
  # no internships are open yet; future intern/co-op/fellowship postings enter the usual filters.
  ashby:
    notion: Notion
    mecka.ai: Mecka
    typesafe-ai: TypeSafe AI
    general-medicine: General Medicine
    supabase: Supabase
    harvey: Harvey
  lever: {spotify: Spotify, palantir: Palantir}

# Named programs for freshmen and sophomores. A title or company+title hit here is the strongest signal Scout has.
# Keys are the company (matched like the tiers above), values are words that appear in the title.
programs:
  google: [step, "student training in engineering"]
  microsoft: [explore]
  nvidia: [ignite]
  meta: ["meta university"]
  # The Fellows Program takes people "regardless of previous experience". Its PhD-only fellowships
  # (Conceptual Reasoning Fellow, STEM Fellow) are not "fellows program" titles, so they get no boost.
  anthropic: ["fellows program"]
  # "fellowship" and "fellows program" count anywhere: company fellowships ("Meritocracy Fellowship") name no
  # role, so without this they were dropped. PhD, graduate, and postdoc fellowships still drop as graduate-only.
  any: [fellowship, fellowships, "fellows program", freshman, freshmen, sophomore, "rising sophomore", "first-year", "first year", "second-year", "second year",
        underclassman, underclassmen, "early insight", "early insights", "early id", explore, exploratory,
        "explore program", "discovery program", "insight program", externship, "pre-internship", "pre internship",
        "student ambassador", "campus ambassador", "campus expert", "campus leader", "student partner", "campus rep",
        "campus representative", "student developer champion", "student champion"]

# "Early career" on its own is usually just a job level at banks and insurers, not a freshman program,
# so it gets a small boost, not the big one.
early_career_weak: ["early career", "early careers"]

# Roles, in priority order. The first group whose words appear in the title wins.
# "ambassador" is checked before "exclude" so "Campus Ambassador (Marketing)" is not thrown out as marketing.
# Then "exclude": a title with any of these words is not a Scout role at all (hardware, quant, pure data
# science, mechanical, etc.), even inside a freshman program, unless it also has a "software_overrides" word.
roles:
  ambassador: ["campus ambassador", "student ambassador", "brand ambassador", "campus expert", "campus leader",
               "campus rep", "campus representative", "student partner", "student rep", "student representative",
               "student developer champion", "student champion", "developer student", "campus evangelist",
               "student evangelist", "campus program", "ambassador"]
  exclude: [mechanical, electrical, civil, chemical, aerospace, hardware, firmware, fpga, asic, silicon, "chip design", "electronics engineer",
            electronics, "electronic design", "physical design", "low voltage",
            "analog", "rf ", photonics, manufactur, "test engineer", quant, quantitative, trading, trader,
            actuarial, accounting, "data scientist", "data science", "research scientist", "applied scientist",
            "machine learning scientist", phd, "ph.d", biostat, nursing, legal, "sales intern", "marketing intern",
            "hr intern", "human resources", finance intern, "financial analyst", "supply chain", logistics,
            "business intelligence", "data engineer", "data analyst", "analytics engineer", "business analyst"]
  # A title with one of these is a software job even if it also has an exclude word
  # ("Privacy and Civil Liberties Software Engineer", "Software Engineer, Trading Systems").
  software_overrides: [software, "full stack", "full-stack", frontend, "front end", backend, "back end"]
  design: [ux, ui, "user experience", "product design", "design engineer", "creative technolog", "visual design",
           "interaction design", "ux/ui", "ui/ux"]
  pm: ["product manag", "product management", apm, "associate product", "product intern", "program manag",
       "technical program", "product analyst", "product owner", "product operations", "product strategy"]
  it: [it, "information technology", "help desk", "service desk", "it support", "technical support",
       "desktop support", "support engineer", "solutions engineer", "systems administrator", sysadmin,
       infrastructure, network, cybersecurity, "security engineer", "systems engineer", "systems intern",
       "cloud engineer", devops, "site reliability", "technology intern", "technology analyst intern",
       "digital technology"]
  swe: [software, swe, sde, developer, "full stack", fullstack, "full-stack", "front end", frontend, "front-end",
        "back end", backend, "back-end", mobile, ios, android, web, programmer, programming, "application engineer",
        "applications engineer", "platform engineer", engineer, engineering, "ai engineer", "ml engineer",
        "machine learning engineer", "ai applications", "applied ai", "developer technology",
        "application development", "software development", "computer science", "technical staff", python]

# Where you want to be, best first. Priority locations and US remote get the full location points,
# anywhere else in the US gets some, outside the US gets none. Nothing is hidden for location.
locations:
  priority: ["nj", "new jersey", newark, "jersey city", princeton, "new brunswick", hoboken, nyc,
             "new york", ", ny", brooklyn, manhattan, "remote in usa", "remote (us", "remote - us", "remote, us"]
  remote_words: [remote]          # a bare "Remote" counts as priority unless it names another country
  non_us_words: [canada, uk, "united kingdom", london, india, ireland, germany, france, singapore, australia,
                 netherlands, israel, poland, spain, italy, japan, mexico, brazil, "remote in canada",
                 "remote in uk", "remote in europe", toronto, vancouver, montreal, ottawa, dublin, bangalore,
                 bengaluru, hyderabad, tel aviv, berlin, paris, amsterdam, sydney, zurich, ontario, "british columbia", quebec, scotland, edinburgh, belfast]

# Words you care about. Each hit in the title adds a few points (see scoring.yaml).
keywords: [ai, "ai applications", ios, accessibility, "developer tools", "developer experience", cloud,
           "product", design, automation, "creative"]

# Degree values that mean "graduate students only". A listing whose degrees are ONLY these is dropped.
graduate_only_degrees: ["Master's", "PhD", "MBA"]

# Work authorization. Authorized to work in the US with no sponsorship needed, so "Does Not Offer
# Sponsorship" never matters. us_citizen decides "U.S. Citizenship is Required" postings:
# false drops them, true keeps them, null (not confirmed yet) keeps them with a "US citizens only" label.
# Postings outside the US are dropped for now (matching.outside_us_only); opening them up is a later option.
us_citizen: true

# Your expected graduation year, for the page check that reads "graduating in 2027 or 2028" off the posting.
graduation_year: 2030

# Postings that require a previous internship ("Previous internship experience is required.", Harvey) are only
# ruled out without one. Four summers at Lumasoft (2023 to 2026) and Rutgers Athletics count.
past_internship: true

# Listings posted more than this many days ago are dropped even if the list still says "active".
# (The Simplify list only hides rows after about 2 months in its README, but the JSON keeps them active.)
max_age_days: 240
