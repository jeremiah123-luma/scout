# Let's Add to Your Resume: certifications. This file holds identity only: names, links, which roles each one
# helps, and why. Cost, hours, and free-or-not are never written here: scout/certs.py reads them from the provider's
# own page each week and keeps the sentence it found as evidence. A value it can't find stays blank and the card says
# "check <provider>". roles: swe, pm, itcs, ux.
certs:
  - key: cert:aws-cloud-practitioner
    name: AWS Certified Cloud Practitioner
    provider: AWS
    url: "https://aws.amazon.com/certification/certified-cloud-practitioner/"
    roles: [swe, itcs, pm]
    why: "the most recognized entry cloud credential, and it unlocks a 50% discount on later AWS exams."
    resume_line: "AWS Certified Cloud Practitioner, {year}"
    cost: { pattern: 'Cost\s+(\d[\d,]*)\s+USD', format: "${0} exam fee" }
    student: { pattern: 'free, curated learning path', url: "https://aws.amazon.com/education/awseducate/", text: "AWS Educate: free learning path" }
  - key: cert:aws-educate
    name: AWS Educate learning path
    provider: AWS
    url: "https://aws.amazon.com/education/awseducate/"
    roles: [swe, itcs]
    why: "free cloud and AI skill badges you can finish before paying for an exam."
    resume_line: "Completed the AWS Educate cloud skills learning path, {year}"
    cost: { pattern: 'your (free), curated learning path', format: "Free" }
  - key: cert:gcp-digital-leader
    name: Google Cloud Digital Leader
    provider: Google Cloud
    url: "https://cloud.google.com/learn/certification/cloud-digital-leader"
    roles: [pm, itcs, swe]
    why: "business-friendly cloud fundamentals, a good fit for product and IT roles."
    resume_line: "Google Cloud Digital Leader certification, {year}"
    cost: { pattern: 'Registration fee:\s*\$(\d[\d,]*)', format: "${0} exam fee" }
  - key: cert:azure-fundamentals
    name: Microsoft Azure Fundamentals (AZ-900)
    provider: Microsoft
    url: "https://learn.microsoft.com/en-us/credentials/certifications/azure-fundamentals/"
    roles: [swe, itcs]
    why: "foundational cloud concepts on the platform most campus IT shops run."
    resume_line: "Microsoft Certified: Azure Fundamentals, {year}"
    cost: { pattern: 'exam (?:fee|price)[^$]{0,40}\$(\d[\d,]*)', format: "${0} exam fee" }
  - key: cert:github-foundations
    name: GitHub Foundations
    provider: GitHub
    url: "https://examregistration.github.com/certification/GHF"
    roles: [swe, pm]
    why: "shows you know the workflow every engineering team uses."
    resume_line: "GitHub Foundations certification, {year}"
    cost: { pattern: 'Registration fee:?\s*\$(\d[\d,]*)', format: "${0} exam fee" }
  - key: cert:google-ux-design
    name: Google UX Design Professional Certificate
    provider: Coursera / Google
    url: "https://www.coursera.org/professional-certificates/google-ux-design"
    roles: [ux, pm]
    why: "a portfolio-backed credential for the UX track, with three projects to show."
    resume_line: "Google UX Design Professional Certificate, {year}"
    cost: { pattern: 'charges \$(\d+) per month after the initial (\d+)-day free trial', format: "${0}/month after a {1}-day free trial" }
    hours: { pattern: '(\d+) months at (\d+) hours a week', format: "{0} months at {1} hours a week (provider estimate)" }
    student: { pattern: 'Financial aid available', text: "Coursera financial aid is available" }
  - key: cert:hf-agents-course
    name: Hugging Face AI Agents Course
    provider: Hugging Face
    url: "https://huggingface.co/learn/agents-course/unit0/introduction"
    roles: [swe, pm]
    why: "a certificate of completion for building agents, which fits AI-leaning internship asks."
    resume_line: "Completed the Hugging Face AI Agents course (certificate of completion), {year}"
    cost: { pattern: '(?i)\b(this free course|free course)\b', format: "Free" }
    hours: { pattern: 'approximately (\d+)-(\d+) hours of work per week', format: "{0}-{1} hours a week (provider estimate)" }
  - key: cert:hf-mcp-course
    name: Hugging Face MCP Course
    provider: Hugging Face
    url: "https://huggingface.co/learn/mcp-course/unit0/introduction"
    roles: [swe, pm]
    why: "free, built with Anthropic, and gives a certificate of completion."
    resume_line: "Completed the Hugging Face Model Context Protocol course (certificate of completion), {year}"
    cost: { pattern: '(?i)\b(this free course)\b', format: "Free" }
