# Scout dashboard: one Cloudflare Worker on the free tier, with one KV namespace.
#
# Secrets (set with `npx wrangler secret put <NAME>` from this folder, never written here):
#   DASH_PASSWORD   what Jeremiah types to unlock the dashboard
#   SESSION_SECRET  signs the login cookie (openssl rand -base64 48)
#   INGEST_SECRET   the GitHub Actions cron sends this in an x-scout-secret header when it pushes data
#   GH_DISPATCH_TOKEN  optional: a fine-grained GitHub token for this repo only, Actions read and write.
#                      Lets the hourly check below start a run when GitHub skipped its own.
#   NTFY_TOPIC         optional: the same topic the cron pushes to, for the "no run in 4 hours" alert
name = "scout-dashboard"
main = "src/index.js"
compatibility_date = "2026-10-01"

[[kv_namespaces]]
binding = "SCOUT"
id = "ce5c08ee20004673a4cdb38fb5ea844c"

# Accounts for other people (multi-user plan, U1 and U2): users, their answers to the sign-up questions, and
# login attempts, in D1 (Cloudflare's free SQL database). LOCAL ONLY so far: `npx wrangler dev --local` keeps it
# in .wrangler/. Before this branch can deploy, create the real one (`npx wrangler d1 create scout-users`) and put
# its id here; until then the id below is a placeholder and `wrangler deploy` will refuse it.
[[d1_databases]]
binding = "DB"
database_name = "scout-users"
database_id = "00000000-0000-0000-0000-000000000000"

# Lets `import tokens from "./tokens.css"` work: the file comes in as a plain string.
[[rules]]
type = "Text"
globs = ["**/*.css"]
fallthrough = true

[vars]
GH_REPO = "jeremiah123-luma/scout"

# Every hour at :47, skipping 10 and 11 UTC like the GitHub schedule (the Morning Brief's hours).
# See heartbeat() in src/index.js.
[triggers]
crons = ["47 0-9,12-23 * * *"]
