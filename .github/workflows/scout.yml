# Scout cron. The repo is public, so GitHub Actions minutes are free and unlimited.
#
# One schedule: every hour at :17, all in watch mode. GitHub runs scheduled jobs late or skips them
# when it is busy, so the schedule is hourly and the 7:00 PM digest is not a schedule of its own:
# every run checks whether the digest is due (after 7:00 PM New York time, not yet sent today).
# Hours 10 and 11 UTC (early morning in New York) are skipped
# (that is 6:17 and 7:17 AM in summer time, 5:17 and 6:17 AM in winter).
on:
  schedule:
    - cron: "17 0-9,12-23 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "watch, digest, test, or catchup (once: the big tech postings the first run seeded)"
        type: choice
        options: [watch, digest, test, catchup]
        default: "watch"

permissions:
  contents: write   # the run commits data/ back to the repo

concurrency:
  group: scout
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # State (seen list, page baselines, matches) lives on the separate "data" branch so main
      # only holds code. It is checked out into data/ and committed back there after the run.
      - name: Check out the data branch into data/
        run: |
          git fetch --depth=1 origin data
          git worktree add -B data data origin/data

      # The input reaches the shell only as an environment variable and is checked against the four modes,
      # so nothing typed into "Run workflow" (or sent through the API) can become part of a command.
      - name: Pick the mode
        id: mode
        env:
          INPUT_MODE: ${{ github.event.inputs.mode }}
        run: |
          case "${INPUT_MODE:-watch}" in
            watch|digest|test|catchup) echo "mode=${INPUT_MODE:-watch}" >> "$GITHUB_OUTPUT" ;;
            *) echo "unknown mode" >&2; exit 1 ;;
          esac

      - name: Pull phone changes from the dashboard
        env:
          SCOUT_URL: ${{ secrets.SCOUT_URL }}
          SCOUT_INGEST_SECRET: ${{ secrets.SCOUT_INGEST_SECRET }}
        run: python -m scout.sync pull

      - name: Run Scout
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: python -m scout.run --mode "$MODE"

      # Hackathons about daily and certifications about weekly (scout/feed.py decides what is due). It can never
      # fail the run: a source that can't be read keeps its last good copy.
      - name: Refresh the resume feed
        continue-on-error: true
        env:
          SCOUT_URL: ${{ secrets.SCOUT_URL }}
          SCOUT_INGEST_SECRET: ${{ secrets.SCOUT_INGEST_SECRET }}
        run: python -m scout.feed

      - name: Push this run to the dashboard
        if: always()
        env:
          SCOUT_URL: ${{ secrets.SCOUT_URL }}
          SCOUT_INGEST_SECRET: ${{ secrets.SCOUT_INGEST_SECRET }}
        run: python -m scout.sync push

      - name: Commit data to the data branch
        if: always()
        working-directory: data
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          git config user.name "scout-bot"
          git config user.email "scout-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "data: ${MODE} run $(TZ=America/New_York date +'%Y-%m-%d %-I:%M %p ET')"
            git pull --rebase origin data || true
            git push origin HEAD:data
          fi
